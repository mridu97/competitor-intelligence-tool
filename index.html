<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Competitor Intelligence Tool</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4ff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }

        .card {
            background: white; border-radius: 16px; padding: 40px; max-width: 750px; width: 100%;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            animation: slideUp 0.5s ease forwards;
            opacity: 0;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .badge { background: #fef3c7; color: #d97706; font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 20px; display: inline-block; margin-bottom: 12px; }
        h1 { color: #1a1a2e; font-size: 28px; margin-bottom: 8px; }
        p.subtitle { color: #6b7280; margin-bottom: 28px; font-size: 15px; }
        label { font-weight: 600; font-size: 14px; color: #374151; display: block; margin-bottom: 6px; margin-top: 18px; }
        input, textarea { width: 100%; padding: 11px 14px; border: 1.5px solid #e5e7eb; border-radius: 8px; font-size: 14px; color: #1a1a2e; transition: border 0.2s; }
        input:focus, textarea:focus { outline: none; border-color: #d97706; }
        textarea { resize: vertical; }

        .competitor-row {
            display: flex; gap: 10px; margin-bottom: 10px;
            animation: fadeIn 0.3s ease forwards;
            opacity: 0;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .competitor-row input { flex: 1; }

        .comp-counter { font-size: 13px; color: #d97706; font-weight: 600; margin-top: 8px; display: block; }

        button.add { background: white; color: #d97706; border: 1.5px solid #d97706; padding: 9px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; margin-top: 8px; transition: background 0.2s; }
        button.add:hover { background: #fef3c7; }

        button.analyze { background: #d97706; color: white; padding: 13px 28px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 600; margin-top: 24px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; transition: background 0.2s; }
        button.analyze:hover { background: #b45309; }
        button.analyze:disabled { background: #f59e0b; cursor: not-allowed; }

        .spinner { width: 18px; height: 18px; border: 3px solid rgba(255,255,255,0.4); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; flex-shrink: 0; }
        @keyframes spin { to { transform: rotate(360deg); } }

        #result-box {
            margin-top: 28px; display: none;
            animation: slideUp 0.4s ease forwards;
            opacity: 0;
        }
        #result-box h3 { font-size: 14px; font-weight: 600; color: #6b7280; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }

        #result { background: #fffbeb; border: 1.5px solid #fde68a; border-radius: 8px; padding: 20px; font-size: 14px; line-height: 1.8; color: #1a1a2e; }
        #result .section { margin-bottom: 20px; }
        #result .section-title { font-weight: 700; font-size: 15px; color: #d97706; margin-bottom: 6px; border-bottom: 1.5px solid #fde68a; padding-bottom: 4px; }
        #result .section-body { white-space: pre-wrap; }

        button.copy { margin-top: 12px; background: white; color: #d97706; border: 1.5px solid #d97706; padding: 9px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.2s; }
        button.copy:hover { background: #d97706; color: white; }
        .copied { color: #059669 !important; border-color: #059669 !important; }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">COMPETITIVE INTEL</div>
        <h1>Competitor Intelligence Tool</h1>
        <p class="subtitle">Scrape your competitors' websites and get an AI-powered positioning brief instantly.</p>

        <label>Your Product / Company</label>
        <textarea id="your_product" rows="2" placeholder="e.g. AI-powered onboarding platform for HR teams at mid-size SaaS companies"></textarea>

        <label>Competitors (Name + Website)</label>
        <div id="competitors-list">
            <div class="competitor-row" style="animation-delay: 0.1s">
                <input type="text" placeholder="Competitor name (e.g. Freshworks)" class="comp-name" />
                <input type="text" placeholder="Website URL (e.g. https://freshworks.com)" class="comp-url" />
            </div>
        </div>
        <span class="comp-counter" id="comp-counter">1 competitor added</span>
        <button class="add" id="addBtn">+ Add Competitor</button>

        <button class="analyze" id="analyzeBtn">
            <div class="spinner" id="spinner"></div>
            <span id="btn-text">Generate Intelligence Brief</span>
        </button>

        <div id="result-box">
            <h3>Intelligence Brief</h3>
            <div id="result"></div>
            <button class="copy" id="copyBtn">Copy to Clipboard</button>
        </div>
    </div>

    <script>
        var competitorCount = 1;

        function updateCounter() {
            var names = document.querySelectorAll(".comp-name");
            var filled = 0;
            names.forEach(function(n) { if (n.value.trim()) filled++; });
            var counter = document.getElementById("comp-counter");
            counter.innerText = competitorCount + (competitorCount === 1 ? " competitor added" : " competitors added");
        }

        document.getElementById("competitors-list").addEventListener("input", updateCounter);

        document.getElementById("addBtn").addEventListener("click", function() {
            competitorCount++;
            var list = document.getElementById("competitors-list");
            var row = document.createElement("div");
            row.className = "competitor-row";
            row.innerHTML = '<input type="text" placeholder="Competitor name" class="comp-name" /><input type="text" placeholder="Website URL" class="comp-url" />';
            list.appendChild(row);
            updateCounter();
        });

        var loadingMessages = [
            "Scraping competitor sites...",
            "Reading their positioning...",
            "Analyzing messaging patterns...",
            "Finding gaps and opportunities...",
            "Writing your brief..."
        ];
        var msgIndex = 0;
        var msgInterval = null;

        function startLoadingMessages() {
            msgIndex = 0;
            document.getElementById("btn-text").innerText = loadingMessages[0];
            msgInterval = setInterval(function() {
                msgIndex = (msgIndex + 1) % loadingMessages.length;
                document.getElementById("btn-text").innerText = loadingMessages[msgIndex];
            }, 2500);
        }

        function stopLoadingMessages() {
            clearInterval(msgInterval);
            document.getElementById("btn-text").innerText = "Generate Intelligence Brief";
        }

        function renderBrief(text) {
            var result = document.getElementById("result");
            result.innerHTML = "";

            var sections = text.split(/\n(?=\d\.|#{1,3} |[A-Z ]{4,}:)/);

            if (sections.length <= 1) {
                result.innerHTML = '<div class="section"><div class="section-body">' + text.replace(/\n/g, '<br>') + '</div></div>';
                return;
            }

            sections.forEach(function(section) {
                var lines = section.trim().split("\n");
                var title = lines[0].replace(/^#+\s*/, '').replace(/^\d+\.\s*/, '').replace(/:$/, '').trim();
                var body = lines.slice(1).join("\n").trim();
                if (!body) { body = title; title = ""; }

                var div = document.createElement("div");
                div.className = "section";
                if (title) {
                    div.innerHTML = '<div class="section-title">' + title + '</div><div class="section-body">' + body.replace(/\n/g, '<br>') + '</div>';
                } else {
                    div.innerHTML = '<div class="section-body">' + body.replace(/\n/g, '<br>') + '</div>';
                }
                result.appendChild(div);
            });
        }

        document.getElementById("analyzeBtn").addEventListener("click", function() {
            var spinner = document.getElementById("spinner");
            var resultBox = document.getElementById("result-box");

            var names = document.querySelectorAll(".comp-name");
            var urls = document.querySelectorAll(".comp-url");
            var competitors = [];
            for (var i = 0; i < names.length; i++) {
                if (names[i].value && urls[i].value) {
                    competitors.push({ name: names[i].value, url: urls[i].value });
                }
            }

            if (competitors.length === 0) {
                alert("Please add at least one competitor with a name and URL.");
                return;
            }

            spinner.style.display = "block";
            startLoadingMessages();
            document.getElementById("analyzeBtn").disabled = true;
            resultBox.style.display = "none";

            fetch("/analyze", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    your_product: document.getElementById("your_product").value,
                    competitors: competitors
                })
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                spinner.style.display = "none";
                stopLoadingMessages();
                document.getElementById("analyzeBtn").disabled = false;
                resultBox.style.display = "block";
                if (data.error) {
                    document.getElementById("result").innerText = "Error: " + data.error;
                } else {
                    renderBrief(data.brief);
                }
            })
            .catch(function(err) {
                spinner.style.display = "none";
                stopLoadingMessages();
                document.getElementById("analyzeBtn").disabled = false;
                resultBox.style.display = "block";
                document.getElementById("result").innerText = "Something went wrong: " + err.message;
            });
        });

        document.getElementById("copyBtn").addEventListener("click", function() {
            var text = document.getElementById("result").innerText;
            navigator.clipboard.writeText(text).then(function() {
                var btn = document.getElementById("copyBtn");
                btn.innerText = "Copied!";
                btn.classList.add("copied");
                setTimeout(function() {
                    btn.innerText = "Copy to Clipboard";
                    btn.classList.remove("copied");
                }, 2000);
            });
        });
    </script>
</body>
</html>
